<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bách Khoa Toàn Thư Mật Tông - 133 Pháp Khí & Bổn Tôn</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #080c14; color: #f1f5f9; }
    .font-cinzel { font-family: 'Cinzel', serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0f172a; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #d97706; }
    .node-transition { transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease; }
    .bija-glow { text-shadow: 0 0 12px rgba(245, 158, 11, 0.8), 0 0 24px rgba(245, 158, 11, 0.4); }
  </style>
</head>
<body class="min-h-screen flex flex-col bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-amber-950/25 via-[#0a0f1d] to-[#050811]">

  <!-- Header -->
  <header class="border-b border-amber-500/20 bg-slate-950/80 backdrop-blur sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3 sm:px-6 lg:px-8 flex flex-col md:flex-row justify-between items-center gap-3">
      <div class="text-center md:text-left">
        <div class="flex items-center justify-center md:justify-start gap-2">
          <span class="text-amber-400 text-2xl">☸</span>
          <h1 class="font-cinzel text-lg sm:text-xl font-bold tracking-wider text-amber-400">MẬT TÔNG KIM CƯƠNG THỪA</h1>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex flex-wrap items-center justify-center gap-2 w-full md:w-auto">
        <div class="bg-slate-900 border border-amber-500/40 p-1 rounded-xl flex items-center shadow-inner">
          <button onclick="setViewMode('grid')" id="viewModeGrid" class="px-3 py-1 text-xs rounded-lg font-semibold bg-amber-500 text-slate-950 transition">
            ⊞ Lưới Thẻ
          </button>
          <button onclick="setViewMode('mandala')" id="viewModeMandala" class="px-3 py-1 text-xs rounded-lg font-semibold text-slate-300 hover:text-white transition">
            ☸ Mạn-đà-la
          </button>
        </div>

        <div id="systemSelectorWrap" class="bg-slate-900 border border-slate-700/80 p-1 rounded-xl flex items-center">
          <button onclick="setSystem('all')" id="sys-all" class="sys-btn px-2.5 py-1 text-xs rounded-lg font-semibold bg-amber-500 text-slate-950 transition">Tất Cả</button>
          <button onclick="setSystem('phap_khi')" id="sys-phapkhi" class="sys-btn px-2.5 py-1 text-xs rounded-lg font-semibold text-slate-300 hover:text-white transition">Pháp Khí</button>
          <button onclick="setSystem('deity')" id="sys-deity" class="sys-btn px-2.5 py-1 text-xs rounded-lg font-semibold text-slate-300 hover:text-white transition">Tôn Tượng</button>
        </div>

        <button onclick="exportBackupData()" class="text-xs font-semibold px-2.5 py-1.5 bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 border border-emerald-500/40 rounded-xl transition shadow">
          💾 Sao Lưu
        </button>

        <button onclick="document.getElementById('backupFileInput').click()" class="text-xs font-semibold px-2.5 py-1.5 bg-sky-500/20 hover:bg-sky-500/30 text-sky-300 border border-sky-500/40 rounded-xl transition shadow">
          📥 Nạp Lại
        </button>
        <input type="file" id="backupFileInput" accept=".json" class="hidden" onchange="importBackupData(event)" />

        <button onclick="document.getElementById('batchFileInput').click()" class="text-xs font-semibold px-2.5 py-1.5 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 rounded-xl transition shadow">
          📁 Nạp Loạt Ảnh
        </button>
        <input type="file" id="batchFileInput" multiple accept="image/*" class="hidden" onchange="handleBatchUpload(event)" />

        <div class="relative flex-1 md:w-48">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="Tìm 133 mục hoặc ID..." 
            class="w-full bg-slate-900 text-xs border border-slate-700 rounded-xl pl-8 pr-3 py-1.5 text-white placeholder-slate-400 focus:outline-none focus:border-amber-500"
          />
          <span class="absolute left-2.5 top-1.5 text-slate-400 text-xs">🔍</span>
        </div>
      </div>
    </div>

    <!-- Category Tabs -->
    <div id="categoryBar" class="max-w-7xl mx-auto px-4 py-2 overflow-x-auto border-t border-slate-800/60">
      <div class="flex space-x-2 py-0.5" id="categoryTabs"></div>
    </div>
  </header>

  <!-- VIEW 1: GRID VIEW -->
  <main id="gridViewContainer" class="flex-1 max-w-7xl w-full mx-auto px-4 py-5">
    <div class="text-xs text-slate-400 mb-3 flex justify-between items-center" id="statusCount"></div>
    <div id="cardsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>
  </main>

  <!-- VIEW 2: MANDALA VIEW -->
  <main id="mandalaViewContainer" class="hidden flex-1 w-full flex-col items-center justify-between overflow-hidden relative min-h-[720px] py-4">
    <div class="z-20 flex items-center gap-3 bg-slate-900/80 border border-slate-700/70 backdrop-blur px-4 py-2 rounded-2xl shadow-xl">
      <span class="text-xs text-amber-400 font-semibold uppercase">Góc Xoay:</span>
      <button onclick="rotateDial(-45)" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-amber-600 text-amber-300 text-xs font-semibold">↺ -45°</button>
      <button onclick="resetDial()" class="px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300 text-xs font-semibold">0° Chuẩn Định</button>
      <button onclick="rotateDial(45)" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-amber-600 text-amber-300 text-xs font-semibold">↻ +45°</button>
    </div>

    <div class="relative flex-1 w-full flex items-center justify-center">
      <div id="mandalaWheel" class="relative w-[680px] h-[680px] rounded-full flex items-center justify-center transition-transform duration-700 ease-out">
        <svg id="mandalaSvg" class="absolute inset-0 w-full h-full pointer-events-none z-0" viewBox="-340 -340 680 680">
          <circle cx="0" cy="0" r="85" fill="none" stroke="#d4af37" stroke-width="1.2" stroke-dasharray="3 3" opacity="0.35" />
          <circle cx="0" cy="0" r="175" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.3" />
          <circle cx="0" cy="0" r="260" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.3" />
          <line x1="-300" y1="0" x2="300" y2="0" stroke="#d4af37" stroke-width="0.8" opacity="0.2" />
          <line x1="0" y1="-300" x2="0" y2="300" stroke="#d4af37" stroke-width="0.8" opacity="0.2" />
          <g id="rayGroup"></g>
        </svg>
        <div id="nodesContainer" class="absolute inset-0 w-full h-full"></div>
      </div>
    </div>

    <div class="w-full max-w-xl px-4 z-20">
      <div id="inspectorCard" class="bg-slate-900/90 border border-amber-500/40 rounded-2xl p-3 shadow-2xl flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div id="inspAvatar" class="w-11 h-11 rounded-xl bg-slate-800 border border-amber-500/50 flex items-center justify-center text-amber-300 overflow-hidden">☸</div>
          <div>
            <h3 id="inspName" class="text-sm font-bold text-amber-300">Chưa chọn vị Bổn Tôn</h3>
            <p id="inspMeta" class="text-xs text-slate-400 italic">Rê chuột vào nốt trên Mạn-đà-la</p>
          </div>
        </div>
        <button id="inspDetailBtn" class="text-xs text-amber-400 hover:text-white underline hidden">Chi tiết ➔</button>
      </div>
    </div>
  </main>

  <!-- Input nạp ảnh ẩn -->
  <input type="file" id="singleFileInput" accept="image/*" class="hidden" onchange="handleSingleUpload(event)" />
  <input type="file" id="mudraFileInput" accept="image/*" class="hidden" onchange="handleMudraUpload(event)" />

  <!-- Toast Thông Báo -->
  <div id="toastNotification" class="fixed bottom-5 right-5 z-[70] bg-slate-900 border border-amber-500/50 text-amber-300 px-4 py-2 rounded-xl text-xs shadow-2xl opacity-0 transition-opacity duration-300 pointer-events-none flex items-center gap-2">
    <span>ℹ️</span> <span id="toastMessage">Thông báo</span>
  </div>

  <!-- Modal Chi Tiết -->
  <div id="detailModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm hidden items-center justify-center p-3 sm:p-6 z-50 overflow-y-auto">
    <div class="bg-slate-900 border border-amber-500/30 max-w-3xl w-full rounded-2xl p-5 sm:p-7 relative max-h-[92vh] overflow-y-auto shadow-2xl custom-scrollbar">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 p-2 rounded-full leading-none">✕</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <!-- Modal Phóng To Ảnh (Lightbox Zoom) -->
  <div id="imageZoomModal" class="fixed inset-0 bg-black/95 backdrop-blur-md hidden items-center justify-center z-[60] p-2 sm:p-6 cursor-zoom-out" onclick="closeZoomModal()">
    <button onclick="closeZoomModal()" class="absolute top-4 right-4 text-slate-300 hover:text-white bg-slate-800/80 hover:bg-slate-700 p-2.5 rounded-full transition leading-none z-10 shadow-lg">✕</button>
    <div class="relative max-w-5xl max-h-[92vh] flex items-center justify-center" onclick="event.stopPropagation()">
      <img id="zoomedImageDisplay" src="" alt="Zoomed" class="max-w-full max-h-[90vh] object-contain rounded-xl shadow-2xl border border-amber-500/40 select-none" />
      <span class="absolute bottom-2 bg-black/75 text-amber-300 text-[11px] px-3.5 py-1 rounded-full border border-amber-500/30 pointer-events-none shadow backdrop-blur-sm">
        Nhấp ra ngoài hoặc nhấn phím ESC để đóng
      </span>
    </div>
  </div>

    let audioCtx = null;
    function playChime(freq = 528, type = 'sine', duration = 1.0) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function showToast(msg) {
      const toast = document.getElementById('toastNotification');
      const text = document.getElementById('toastMessage');
      if (toast && text) {
        text.innerText = msg;
        toast.style.opacity = '1';
        setTimeout(() => { toast.style.opacity = '0'; }, 2500);
      }
    }

    function copyTextToClipboard(text, label = 'nội dung') {
      navigator.clipboard.writeText(text).then(() => {
        showToast(`Đã sao chép ${label}: ${text}`);
      }).catch(() => {
        showToast(`Lỗi sao chép`);
      });
    }

    function playMantraAudio(audioUrl, deityId) {
      const audio = new Audio(audioUrl);
      const playPromise = audio.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const item = VAJRAYANA_MASTER_DATA.find(x => x.id === deityId);
            const textToRead = item?.mantra_vi || item?.mantra_sanskrit || "Om Muni Muni Maha Muni Shakyamunaye Svaha";
            const utterance = new SpeechSynthesisUtterance(textToRead);
            utterance.lang = 'vi-VN';
            utterance.rate = 0.82;
            utterance.pitch = 0.85;

            playChime(432, 'sine', 1.5);
            setTimeout(() => { window.speechSynthesis.speak(utterance); }, 450);
            utterance.onend = () => { playChime(528, 'sine', 1.8); };
          } else {
            playChime(432, 'sine', 2.5);
          }
        });
      }
    }

    function handleImageFallback(imgElement, item) {
      if (!item) return;
      const folder = item.system === 'phap_khi' ? 'phapkhi' : 'bo_ton';
      const exts = ['.jpeg', '.jpg', '.png', '.webp'];
      let currentIdx = parseInt(imgElement.dataset.extIdx || '0', 10);
      currentIdx++;

      if (currentIdx < exts.length) {
        imgElement.dataset.extIdx = currentIdx;
        imgElement.src = `${folder}/${item.id}${exts[currentIdx]}`;
      } else {
        imgElement.onerror = null;
        imgElement.src = `https://placehold.co/600x600/0f172a/d97706?text=${encodeURIComponent(item.name.sanskrit)}`;

        const matchCat = (currentCategory === 'all' || item.category_id === currentCategory);
        const matchQuery = !query ||
          item.id.toLowerCase().includes(query) ||
          item.name.vietnamese.toLowerCase().includes(query) ||
          item.name.sanskrit.toLowerCase().includes(query) ||
          item.name.tibetan.toLowerCase().includes(query) ||
          (item.mantra_sanskrit && item.mantra_sanskrit.toLowerCase().includes(query)) ||
          (item.mantra_vi && item.mantra_vi.toLowerCase().includes(query)) ||
          item.symbolism.core_meaning.toLowerCase().includes(query);
        return matchSys && matchCat && matchQuery;

      if (cardsGrid) cardsGrid.innerHTML = '';

    function renderMandalaNodes() {
      const container = document.getElementById('nodesContainer');
      if (!container) return;
      container.innerHTML = '';
      const center = 340;

      Object.keys(MANDALA_COORDS).forEach(deityId => {
        const item = VAJRAYANA_MASTER_DATA.find(d => d.id === deityId);
        if (!item) return;

        const coord = MANDALA_COORDS[deityId];
        const rad = (coord.theta * Math.PI) / 180;
        const x = center + coord.r * Math.cos(rad);
        const y = center + coord.r * Math.sin(rad);

        const node = document.createElement('div');
        node.className = 'absolute -translate-x-1/2 -translate-y-1/2 cursor-pointer flex flex-col items-center group node-transition z-10';
        node.style.left = `${x}px`;
        node.style.top = `${y}px`;

        const size = coord.layer === 0 ? 'w-12 h-12 ring-2 ring-amber-400' :
                     coord.layer === 1 ? 'w-10 h-10 ring-1 ring-white' : 'w-8 h-8 ring-1 ring-slate-500';

        node.innerHTML = `
          <div class="${size} rounded-full overflow-hidden flex items-center justify-center bg-slate-950 shadow group-hover:scale-125 transition" style="border: 2px solid ${coord.color};">
            <img src="${resolveImagePath(item)}" alt="${item.name.vietnamese}" class="w-full h-full object-cover" onerror="handleImageFallback(this, item)" />

          </span>
        `;
        node.onmouseenter = () => updateInspector(item, coord);
        node.onclick = () => openModal(item);
        container.appendChild(node);
      });
      applyCounterRotation();
    }

    function rotateDial(deg) {
      currentRotation += deg;
      document.getElementById('mandalaWheel').style.transform = `rotate(${currentRotation}deg)`;
      applyCounterRotation();
    }
    function resetDial() {
      currentRotation = 0;
      document.getElementById('mandalaWheel').style.transform = `rotate(0deg)`;
      applyCounterRotation();
    }
    function applyCounterRotation() {
      document.querySelectorAll('#nodesContainer > div').forEach(node => {
        node.style.transform = `translate(-50%, -50%) rotate(${-currentRotation}deg)`;
      });
    }

    function updateInspector(item, coord) {

    // ==========================================

    // ==========================================
    function getMalaData(id) {
      const s = localStorage.getItem(`mala_${id}`);
      return s ? JSON.parse(s) : { count: 0, rounds: 0 };
    }
    function handleMalaCount(id) {
      const data = getMalaData(id);
      data.count++;
      if (data.count >= 108) {
        data.count = 0;
        data.rounds++;
        playChime(880, 'sine', 1.8);
      } else {
        playChime(528, 'triangle', 0.35);
      }
      localStorage.setItem(`mala_${id}`, JSON.stringify(data));
      updateMalaUI(id);
    }
    function resetMala(id) {
      if (confirm("Đặt lại chuỗi niệm cho Bổn Tôn này?")) {
        localStorage.setItem(`mala_${id}`, JSON.stringify({ count: 0, rounds: 0 }));
        updateMalaUI(id);
      }
    }
    function updateMalaUI(id) {
      const data = getMalaData(id);
      const cEl = document.getElementById('malaBeadCount');
      const rEl = document.getElementById('malaRoundCount');
      const pEl = document.getElementById('malaProgressBar');
      if (cEl) cEl.innerText = data.count;
      if (rEl) rEl.innerText = data.rounds;
      if (pEl) pEl.style.width = `${Math.min(100, Math.round((data.count / 108) * 100))}%`;
    }

    function openModal(item) {

                <button onclick="copyTextToClipboard('${item.mantra_sanskrit.replace(/'/g, "\\'")}', 'Chân ngôn Sanskrit')" class="text-xs text-slate-300 bg-slate-800 hover:text-white px-2 py-1 rounded-lg border border-slate-700 transition">

              <p class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold mb-1">Nguyên văn Sanskrit (IAST):</p>
              <p class="font-cinzel text-amber-200 text-sm sm:text-base font-semibold select-all mb-2 leading-relaxed">${item.mantra_sanskrit}</p>
              <p class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold mb-0.5">Phiên âm tụng trì (Việt ngữ):</p>
              <p class="text-xs sm:text-sm text-amber-300/90 font-medium italic select-all">${item.mantra_vi || 'Đang cập nhật phiên âm'}</p>

              <div class="flex-1">
                <div class="flex justify-between text-xs text-slate-300 mb-1">

                <div class="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                  <div id="malaProgressBar" class="bg-amber-500 h-full w-0 transition-all duration-200"></div>

              <button onclick="resetMala('${item.id}')" class="px-2.5 py-2 bg-slate-800 text-slate-400 text-xs rounded-xl border border-slate-700 hover:text-white">↺</button>

      // Khối Thủ Ấn Đặc Trưng (Mudrā) tích hợp ảnh từ thu_an/ và nút Nạp Ấn riêng

        mudraHtml = `
          <div class="bg-slate-950/60 border border-amber-500/25 rounded-2xl p-4 flex flex-col sm:flex-row gap-4 items-center">
            <div class="flex flex-col items-center">
              <div class="w-24 h-24 bg-slate-900 rounded-xl overflow-hidden border border-amber-500/40 flex-shrink-0 flex items-center justify-center p-1 cursor-zoom-in relative group" onclick="openZoomModal('${mudraImg}', event)" title="Nhấp để phóng to ảnh thủ ấn">
                <img src="${mudraImg}" alt="${item.mudra.name}" class="w-full h-full object-contain group-hover:scale-105 transition duration-300" onerror="handleMudraFallback(this, item)" />

              <h3 class="text-amber-400 font-bold text-sm uppercase tracking-wider flex items-center justify-center sm:justify-start gap-1.5">
                <span>🤲</span> Thủ Ấn: <span class="text-amber-200">${item.mudra.name}</span>

              <p><b class="text-slate-400 font-medium">Quy cách kết ấn:</b> ${item.mudra.gesture}</p>
              <p><b class="text-slate-400 font-medium">Ý nghĩa biểu thị:</b> ${item.mudra.meaning}</p>
              <p class="text-[10px] text-slate-500 font-mono mt-1">Đường dẫn tệp thủ ấn: thu_an/${item.id}.jpeg</p>

          </div>

      }

      content.innerHTML = `
        <div class="flex flex-col sm:flex-row gap-5 mb-4 items-center sm:items-start">
          <div class="w-48 flex flex-col items-center">
            <div class="w-48 h-56 bg-slate-950 rounded-2xl overflow-hidden border border-amber-500/30 flex-shrink-0 flex items-center justify-center p-2 relative group cursor-zoom-in" onclick="openZoomModal('${activeImg}', event)" title="Bấm để phóng to ảnh">
              <img id="modalImageDisplay" src="${activeImg}" alt="${item.name.vietnamese}" class="w-full h-full object-contain group-hover:scale-105 transition duration-300" onerror="handleImageFallback(this, item)" />
              <span class="absolute top-2 left-2 bg-black/75 text-amber-300 text-[10px] px-2 py-0.5 rounded border border-amber-500/30 opacity-0 group-hover:opacity-100 transition-opacity">🔍 Phóng to</span>
            </div>
            <button onclick="triggerSingleUpload('${item.id}', event)" class="mt-2.5 w-full py-1.5 px-3 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/40 rounded-xl text-xs font-semibold transition flex items-center justify-center gap-1">

            </button>
          </div>

          <div class="flex-1 text-center sm:text-left">
            <div class="flex items-center justify-center sm:justify-start gap-2 mb-1">
              <span class="text-[10px] uppercase font-bold text-amber-400 bg-amber-950/60 border border-amber-500/30 px-2 py-0.5 rounded">${item.name.tibetan}</span>
              <span class="text-[10px] text-slate-400 uppercase font-semibold">• ${isDeity ? 'Tôn Tượng Bổn Tôn' : 'Pháp Khí Mật Tông'}</span>
            </div>
            
            <h2 class="text-xl sm:text-2xl font-bold text-amber-400 leading-snug">${item.name.vietnamese}</h2>
            
            <!-- HIỂN THỊ MÃ ID TRONG MODAL -->
            <div class="flex items-center justify-center sm:justify-start gap-2 my-1.5">
              <span class="text-xs font-mono bg-slate-950 text-amber-300 border border-amber-500/30 px-2.5 py-0.5 rounded-lg select-all">
                ${item.id}
              </span>
              <button onclick="copyTextToClipboard('${item.id}', 'Mã ID')" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 hover:text-white px-2 py-0.5 rounded border border-slate-700 transition">
                📋 Chép ID
              </button>
            </div>

            <p class="text-xs text-slate-400 italic mb-3">${item.name.sanskrit}</p>
            
            <div class="grid grid-cols-2 gap-2 text-xs bg-slate-950/80 p-2.5 rounded-xl border border-slate-800">
              <div><span class="text-slate-500">Bản chất:</span> <p class="text-slate-200 font-medium">${item.polarity}</p></div>
              <div><span class="text-slate-500">Chất liệu / Căn bản:</span> <p class="text-slate-200 font-medium">${item.element}</p></div>
              <div class="col-span-2 mt-1 pt-1 border-t border-slate-800/60 flex items-center justify-between">
                <span class="text-slate-500 font-mono text-[11px]">Đường dẫn tệp chuẩn:</span>
                <span class="text-amber-400 font-mono text-[11px] select-all">${folder}/${item.id}.jpeg</span>
              </div>
            </div>
          </div>
        </div>

        <div class="space-y-4 text-xs sm:text-sm">
          ${practiceHtml}
          ${mudraHtml}
          <div>
            <h3 class="text-amber-400 font-semibold mb-1">✦ Mật Nghĩa Biểu Tượng Cốt Tủy</h3>
            <p class="text-slate-300 bg-slate-950/70 p-3 rounded-xl border border-slate-800 leading-relaxed">${item.symbolism.core_meaning}</p>
          </div>
          <div>
            <h3 class="text-amber-400 font-semibold mb-1.5">✦ Pháp Khí / Bổn Tôn Liên Quan</h3>

      modal.classList.remove('hidden');

    function closeModal() {
      document.getElementById('detailModal').classList.add('hidden');
      document.getElementById('detailModal').classList.remove('flex');
      if (document.getElementById('imageZoomModal').classList.contains('hidden')) {
        document.body.style.overflow = '';
      }
    }

    // ==========================================
    // 6. SAO LƯU & NẠP ẢNH
    // ==========================================
    function exportBackupData() {
      const payload = { version: "3.2", images: userImages, mudras: userMudraImages, mala: {} };
      VAJRAYANA_MASTER_DATA.forEach(i => {
        const m = localStorage.getItem(`mala_${i.id}`);
        if (m) payload.mala[i.id] = JSON.parse(m);
      });
      const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `Vajrayana_133_Backup.json`;
      a.click();
      showToast("Đã tải tệp sao lưu dữ liệu.");
    }

    function importBackupData(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async function(evt) {
        try {
          const data = JSON.parse(evt.target.result);
          if (data.images) userImages = { ...userImages, ...data.images };
          if (data.mudras) userMudraImages = { ...userMudraImages, ...data.mudras };
          if (data.mala) {
            Object.keys(data.mala).forEach(k => localStorage.setItem(`mala_${k}`, JSON.stringify(data.mala[k])));
          }
          showToast("Nạp tệp sao lưu thành công!");
          filterData();
        } catch(err) {
          showToast("Tệp sao lưu không hợp lệ");
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    }

    function triggerSingleUpload(id, e) {
      if (e) e.stopPropagation();
      currentTargetId = id;
      document.getElementById('singleFileInput').click();
    }

    function handleSingleUpload(e) {
      const file = e.target.files[0];
      if (!file || !currentTargetId) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        userImages[currentTargetId] = evt.target.result;
        filterData();
        const mImg = document.getElementById('modalImageDisplay');
        if (mImg) mImg.src = evt.target.result;
        showToast(`Đã nạp ảnh cho: ${currentTargetId}`);
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    }

    // Xử lý nạp ảnh Thủ Ấn riêng
    function triggerMudraUpload(id, e) {
      if (e) e.stopPropagation();
      currentTargetId = id;
      document.getElementById('mudraFileInput').click();
    }

    function handleMudraUpload(e) {
      const file = e.target.files[0];
      if (!file || !currentTargetId) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        userMudraImages[currentTargetId] = evt.target.result;
        showToast(`Đã nạp ảnh thủ ấn cho: ${currentTargetId}`);
        const item = VAJRAYANA_MASTER_DATA.find(x => x.id === currentTargetId);
        if (item) openModal(item);
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    }

    function handleBatchUpload(e) {
      const files = Array.from(e.target.files);
      let count = 0;
      files.forEach(file => {
        const clean = file.name.replace(/\.[^/.]+$/, "").trim().toLowerCase();
        const matched = VAJRAYANA_MASTER_DATA.find(i => i.id.toLowerCase() === clean || clean.includes(i.id.toLowerCase()));
        if (matched) {
          const reader = new FileReader();
          reader.onload = (evt) => {
            userImages[matched.id] = evt.target.result;
            count++;
            if (count === files.length) {
              filterData();
              showToast(`Đã nạp thành công ${count} ảnh!`);
            }
          };
          reader.readAsDataURL(file);
        }
      });
      e.target.value = '';
    }

    function setViewMode(mode) {
      currentViewMode = mode;
      const gBtn = document.getElementById('viewModeGrid');
      const mBtn = document.getElementById('viewModeMandala');
      const gC = document.getElementById('gridViewContainer');
      const mC = document.getElementById('mandalaViewContainer');
      const catBar = document.getElementById('categoryBar');

      if (mode === 'grid') {
        gBtn.className = "px-3 py-1 text-xs rounded-lg font-semibold bg-amber-500 text-slate-950 transition";
        mBtn.className = "px-3 py-1 text-xs rounded-lg font-semibold text-slate-300 hover:text-white transition";
        gC.classList.remove('hidden');
        mC.classList.add('hidden');
        catBar.classList.remove('hidden');
        filterData();
      } else {
        mBtn.className = "px-3 py-1 text-xs rounded-lg font-semibold bg-amber-500 text-slate-950 transition";
        gBtn.className = "px-3 py-1 text-xs rounded-lg font-semibold text-slate-300 hover:text-white transition";
        gC.classList.add('hidden');
        mC.classList.remove('hidden');
        mC.classList.add('flex');
        catBar.classList.add('hidden');
        renderMandalaNodes();
      }
    }

    function setSystem(sys) {
      currentSystem = sys;
      currentCategory = 'all';
      document.querySelectorAll('.sys-btn').forEach(b => {
        b.classList.remove('bg-amber-500', 'text-slate-950');
        b.classList.add('text-slate-300');
      });
      const active = sys === 'all' ? document.getElementById('sys-all') :
                     sys === 'phap_khi' ? document.getElementById('sys-phapkhi') :
                     document.getElementById('sys-deity');
      if (active) {
        active.classList.add('bg-amber-500', 'text-slate-950');
        active.classList.remove('text-slate-300');
      }
      renderCategoryTabs();
      filterData();
    }

    function renderCategoryTabs() {
      const c = document.getElementById('categoryTabs');
      if (!c) return;
      c.innerHTML = '';
      const all = document.createElement('button');
      all.className = `px-3 py-1 rounded-lg text-xs font-semibold ${currentCategory === 'all' ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300'}`;
      all.innerText = 'Tất Cả';
      all.onclick = () => { currentCategory = 'all'; renderCategoryTabs(); filterData(); };
      c.appendChild(all);

      Object.keys(CATEGORIES).forEach(k => {
        const cat = CATEGORIES[k];
        if (currentSystem === 'all' || cat.system === currentSystem) {
          const b = document.createElement('button');
          b.className = `px-3 py-1 rounded-lg text-xs font-semibold ${currentCategory === k ? 'bg-amber-500 text-slate-950' : 'bg-slate-800 text-slate-300'}`;
          b.innerText = cat.label;
          b.onclick = () => { currentCategory = k; renderCategoryTabs(); filterData(); };
          c.appendChild(b);
        }
      });
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeZoomModal();
        closeModal();
      }
      if (e.code === 'Space' && activeModalItem && activeModalItem.system === 'deity') {
        if (document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA') {
          e.preventDefault();
          handleMalaCount(activeModalItem.id);
        }
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      const searchBox = document.getElementById('searchInput');
      if (searchBox) searchBox.addEventListener('input', filterData);
      renderCategoryTabs();
      filterData();
    });
  </script>
